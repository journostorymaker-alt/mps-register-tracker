name: Update register and site

on:
  schedule:
    # Registers usually come out on alternate Mondays. Check Tuesday and Thursday mornings (UTC).
    - cron: "23 6 * * 2,4"
  workflow_dispatch:
    inputs:
      backfill:
        description: "How many recent registers to make sure we hold"
        default: "1"
  push:
    branches: [main]
    paths: ["scripts/**", "site/index.html", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas==2.2.3

      - name: Download from the Parliament API
        id: fetch
        run: python scripts/fetch.py --backfill "${{ github.event.inputs.backfill || '1' }}"

      - name: Build the data files
        run: python scripts/build.py

      - name: Find out more about funders (Wikidata, and Companies House if a key is set)
        env:
          CH_API_KEY: ${{ secrets.CH_API_KEY }}
        timeout-minutes: 45
        continue-on-error: true
        run: python -u scripts/enrich.py

      - name: Rebuild with funder details
        run: python scripts/build.py

      - name: Save new data to the repo
        run: |
          git config user.name "register-bot"
          git config user.email "register-bot@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "Register update $(date -u +%Y-%m-%d)"
          # someone may have pushed while this ran: merge their changes (keeping this run's data) and retry
          for i in 1 2 3 4 5; do
            git push && break
            git pull --rebase -X theirs || { git rebase --abort; git pull --no-rebase -X ours --no-edit; }
            python scripts/build.py && git add data site/data && (git diff --cached --quiet || git commit -m "Rebuild after merge")
            sleep 5
          done

      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site
      - id: deployment
        if: always()
        uses: actions/deploy-pages@v4
